# ── Catálogo de mensajes (idioma único: es · versión NEUTRA/DISTRIBUCIÓN) ────
# Resolución: plugins/DreamCraftProtection/messages.yml (override del servidor)
#             → este archivo (default embebido) → fallback en código.
# Soporta códigos & y placeholders {nombre}.
#
# VOCABULARIO: los términos de dominio NO están escritos a mano — usan los
# placeholders {name.ward} / {name.city} / {name.estate}, que se resuelven con
# command-names en config.yml. Un servidor que renombre a sync/matriz/nexo ve
# "[Sync] / [Matriz] / [Nexo]" en TODOS los textos sin tocar este archivo.
# Las raíces de comando ({cmd.ward}) se resuelven igual.

prefixes:
  global: "&5[DreamCraft]"
  ward: "&3[{name.ward}]"
  city: "&b[{name.city}]"
  estate: "&d[{name.estate}]"
  protection: "&3[Protección]"

common:
  players-only: "&cEste comando solo puede ser usado por jugadores."
  no-permission: "&cNo tienes permiso para usar este comando."
  no-permission-action: "&cNo tienes permiso para este comando."
  unknown-subcommand: "&cSubcomando desconocido: {sub}"
  error: "&cError: {message}"
  invalid-amount: "&cCantidad inválida: {amount}"
  player-not-found: "&cJugador {player} no encontrado o no está en línea."
  # Acciones de energía/mejora exigen presencia física junto al bloque
  physical-required: "&cDebes interactuar físicamente con tu bloque para esto."
  physical-hint: "&7El enlace remoto es exclusivo VIP."

sync:
  sintonized: "&aAcceso compartido habilitado: construcción y contenedores públicos."
  desintonized: "&eAcceso público revocado: construcción y contenedores cerrados."
  tp-done: "Teletransporte al núcleo completado."
  nucleus-not-found: "&c{name.ward} no encontrado. Usa <id> o el nombre de un jugador online."

help:
  ward:
    header: "&b&lDreamCraft {name.ward}"
    subtitle: "&7Gestiona tu territorio. Raíz actual: &f/{cmd.ward}"
    lines:
      - "&f/{cmd.ward} create              &7— Crear Ward en tu posición"
      - "&f/{cmd.ward} rename <nombre>    &7— Renombrar tu Ward"
      - "&f/{cmd.ward} info [id]          &7— Ver información del Ward"
      - "&f/{cmd.ward} sintonizar         &7— Abrir acceso público de construcción"
      - "&f/{cmd.ward} expulsar           &7— Cerrar el acceso público"
      - "&f/{cmd.ward} permissions [perm grant|revoke] &7— Permisos detallados"
      - "&f/{cmd.ward} upkeep deposit <material> <n> &7— Depositar mantenimiento"
      - "&f/{cmd.ward} score [add <n>]    &7— Ver/añadir score"
      - "&f/{cmd.ward} menu [id]          &7— Abrir menú &8(admins/VIPs)"
      - "&f/{cmd.ward} tp                 &7— Teletransporte al núcleo &8(VIPs/owner)"
      - "&f/{cmd.ward} transfer <jugador> &7— Transferir ownership"
      - "&f/{cmd.ward} city [annex|leave] &7— Anexar/desvincular de ciudad"
      - "&f/{cmd.ward} delete [id]       &7— Eliminar Ward"
      - "&8Staff: /{cmd.ward} abrir <id|jugador> · /{cmd.ward} give"
  city:
    header: "&6&lDreamCraft {name.city}"
    subtitle: "&7Gestiona tu ciudad. Raíz actual: &f/{cmd.city}"
    lines:
      - "&f/{cmd.city} create <nombre>     &7— Crear ciudad"
      - "&f/{cmd.city} info [nombre]      &7— Ver información"
      - "&f/{cmd.city} menu                &7— Abrir menú de ciudad"
      - "&f/{cmd.city} annex <wardId>      &7— Anexar un Ward"
      - "&f/{cmd.city} invite <jugador>    &7— Invitar residente"
      - "&f/{cmd.city} kick <jugador>      &7— Expulsar residente"
      - "&f/{cmd.city} roles <jugador> <rol> &7— Asignar rol"
      - "&f/{cmd.city} bank <deposit|withdraw> <monto> &8(admin)"
      - "&f/{cmd.city} policy set <politica> <on|off> &7— Cambiar política"
      - "&f/{cmd.city} transfer <jugador>  &7— Transferir gobernanza"
      - "&f/{cmd.city} delete              &7— Eliminar ciudad"
      - "&7Roles: GOVERNOR, COUNCIL, CITIZEN, ALLY"
  estate:
    header: "&d&lDreamCraft {name.estate}"
    subtitle: "&7Zonas de expedición grupal. Raíz actual: &f/{cmd.estate}"
    lines:
      - "&f/{cmd.estate} create <id>          &7— Crear instancia (grupo)"
      - "&f/{cmd.estate} discover <tipo>      &7— Unirte a la aventura (end, trial_chamber)"
      - "&f/{cmd.estate} invite <jugador>     &7— Invitar miembro"
      - "&f/{cmd.estate} join <id>           &7— Unirse a una instancia"
      - "&f/{cmd.estate} leave               &7— Salir de la instancia"
      - "&f/{cmd.estate} start               &7— Iniciar instancia"
      - "&f/{cmd.estate} transfer <jugador>   &7— Transferir ownership"
      - "&f/{cmd.estate} info                &7— Ver información"
      - "&f/{cmd.estate} menu                &7— Abrir menú de la instancia"
      - "&f/{cmd.estate} disband             &7— Disolver instancia"
    admin:
      header: "&c&lAdmin:"
      lines:
        - "&f/{cmd.estate} admin create <id> <tipo> [radio|auto] &7— Crear zona de aventura"
        - "&f/{cmd.estate} admin area <id> [radio]  &7— Anclar el área donde estás"
        - "&f/{cmd.estate} admin reset <id>     &7— Reiniciar la instancia de una zona"
        - "&f/{cmd.estate} admin menu           &7— Abrir el menú de zonas"
  protection:
    header: "&5&lDreamCraft Protection"
    subtitle: "&7Gestiona tu Ward — misma mecánica que &f/{cmd.ward}&7."
    lines:
      - "&f/{cmd.protection} claim       &7— Abrir el menú del Ward &8(vips/gobernadores)"
      - "&f/{cmd.protection} status      &7— Consultar el estado del Ward"
      - "&f/{cmd.protection} rename <nombre> &7— Renombrar"
      - "&f/{cmd.protection} upkeep [deposit <material> <n>] &7— Mantenimiento"
      - "&f/{cmd.protection} permissions [perm grant|revoke] &7— Permisos públicos"
      - "&f/{cmd.protection} upgrade     &7— Mejorar el tier del Ward"
      - "&f/{cmd.protection} transfer <jugador> &7— Transferir ownership"
      - "&f/{cmd.protection} members     &7— Info de miembros (vía Ciudad)"
      - "&f/{cmd.protection} dissolve    &7— Disolver el Ward"
    admin:
      header: "&c&lAdmin:"
      lines:
        - "&f/{cmd.protection} give        &7— Recibir Baliza de Ward"
        - "&f/{cmd.protection} recargar    &7— Recargar configuración"
        - "&f/{cmd.protection} recalculate &7— Re-sincronizar la región"
        - "&f/{cmd.protection} integrations &7— Estado del Integration Registry"

# Aventuras instanciadas (zonas END / Trial Chamber creadas por admin)
adventure:
  # Cartel de zona disponible — compartido por el gate de edición y la
  # detección de entrada (mismas claves/placeholders en ambos).
  zone-nearby:
    title: "&6&l{name.estate} &6&lal &f{type} &6&ldisponible"
    subtitle: "&eUnete usando &f/{cmd.estate} discover {type.key}"
  # Etiqueta visible por tipo de aventura y su argumento de subcomando
  type:
    end: "End"
    trial_chamber: "Trial Chamber"
  type-key:
    end: "end"
    trial_chamber: "trial_chamber"
  # Actionbar al chocar con estructura indestructible
  structure-indestructible: "&b✦ La estructura de la aventura es indestructible."

# Ítem físico y títulos de menús — un solo bloque `menu:` (las claves
# duplicadas de YAML se pisan entre sí y pierden los títulos).
items:
  nucleus-name: "&bBaliza de {name.ward}"
  nucleus-lore:
    - "&7Colocala para fundar un {name.ward}"
    - "&7La protección se extiende en radio alrededor de este bloque"

menu:
  title.ward: "&8{name.ward} &f{name}"
  title.city: "&8{name.city} &f{name}"
  title.estate-lobby: "&8{name.estate} &f{name}"
  title.estate-instance: "&8Instancia &f{name}"
  title.estate-admin-zones: "&8Zonas de aventura (admin)"
  # Zonas persistentes creadas por admin — no se unen por ID/menú
  estate.admin-zone: "Esta zona la administra el servidor: creá tu grupo con /{cmd.estate} discover"
  # Feedback de los menús (MenuActionDispatcher) — acción bar / chat.
  unknown-action: "&cAcción no reconocida: {action}"
  internal-error: "Error interno"
  # hints que redirigen a comandos (siempre con raíz versionada del servidor)
  hint.ward-transfer: "Usa /{cmd.ward} transfer <jugador>"
  hint.city-invite: "Usa /{cmd.city} invite <jugador>"
  hint.city-kick: "Usa /{cmd.city} kick <jugador>"
  hint.city-roles: "Usa /{cmd.city} roles <jugador> <rol>"
  hint.estate-invite: "Usa /{cmd.estate} invite <jugador>"