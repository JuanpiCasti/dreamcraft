protection:
  enabled: true
  default-radius: 16
  default-build-radius: 16
  allow-overlap: false
  vertical-mode: full
  require-wardrobe: true
  wardrobe-material: LODESTONE
  inventory-size: 27

upkeep:
  interval: 24h
  warning-threshold: 24h
  expiring-threshold: 6h
  grace-period: 24h
  destruction-delay: 48h
  resource-material: DIAMOND
  units-per-item: 64

members:
  default-max: 8

claim:
  owner-transfer: true
  abandoned-after: 7d

# Bloque especial que crea un Ward al colocarlo.
# La protección del Ward es un radio alrededor de este bloque (su centro).
ward:
  material: BEACON
  item-id: dreamcraft:ward_beacon
  custom-model-data: 41002
  # Puntos de score que suma cada mejora desde el menú del Ward
  score-per-upgrade: 100

  # Ítems aceptados como upkeep del Ward y su valor en unidades por ítem.
  # Se depositan en el slot de upkeep del menú del Ward (o /ward upkeep deposit).
  upkeep-materials:
    DIAMOND: 64
    EMERALD: 48
    GOLD_INGOT: 16
    IRON_INGOT: 8
    COAL: 2

  # Bloques que requieren un tier mínimo del Ward para poder colocarse dentro.
  # La clave es el material; el valor es la clave del ward-tier mínimo requerido.
  # Un Ward recién fundado (basic) no puede colocar estos bloques hasta subir de rango.
  tier-gated-blocks:
    ENCHANTING_TABLE: reinforced
    BREWING_STAND: reinforced
    ANVIL: reinforced
    SMITHING_TABLE: reinforced
    LECTERN: reinforced
    BEACON: advanced
    CONDUIT: advanced
    RESPAWN_ANCHOR: advanced

# Niveles de Ciudad — calculados, no se depositan ítems.
# El nivel se resuelve como el más alto cuyos 3 requisitos se cumplen:
#   min-wards   — wards anexados a la ciudad
#   min-members — habitantes (miembros) de la ciudad
#   min-wealth  — riqueza = suma del baseScore de los wards anexados
#                 (proxy de "objetos caros": cada mejora de ward suma score)
city-levels:
  levels:
    aldea:
      display-name: Aldea
      min-wards: 0
      min-members: 0
      min-wealth: 0
    pueblo:
      display-name: Pueblo
      min-wards: 1
      min-members: 3
      min-wealth: 100
    ciudad:
      display-name: Ciudad
      min-wards: 3
      min-members: 6
      min-wealth: 400
    metropoli:
      display-name: Metrópoli
      min-wards: 6
      min-members: 12
      min-wealth: 1200

# Costo en ítems para mejorar el Ward a cada tier destino.
# La clave es el tier DESTINO de la mejora. Si un tier no está listado, mejorarlo a ese tier es gratis.
ward-upgrade-costs:
  reinforced:
    - material: IRON_INGOT
      amount: 32
    - material: DIAMOND
      amount: 8
  advanced:
    - material: DIAMOND
      amount: 24
    - material: EMERALD
      amount: 16
    - material: NETHERITE_INGOT
      amount: 1

resource-pack:
  enabled: true
  optional: true
  fallback-vanilla: true
  custom-model-data: 41001
  item-id: dreamcraft:protection_wardrobe

tiers:
  basic:
    radius: 12
    build-radius: 12
    max-members: 4
  advanced:
    radius: 16
    build-radius: 16
    max-members: 8
  fortress:
    radius: 24
    build-radius: 24
    max-members: 12
  clan:
    radius: 32
    build-radius: 24
    max-members: 20
  domain:
    radius: 48
    build-radius: 32
    max-members: 30

# Ward tiers — DreamCraft domain tier system for Wards.
# These are SEPARATE from the protection "tiers" above (which govern claim
# radius/build-radius/max-members). Ward tiers govern score→tier→radius
# progression and upkeep cost per interval for the /ward command.
#
# Fields per tier:
#   min-base-score   — lowest score that qualifies for this tier
#   max-base-score   — highest score that qualifies (use 2147483647 for "no cap")
#   base-radius      — protection radius at score = min-base-score
#   radius-per-score — radius grows by floor(baseScore * radius-per-score)
#   upkeep-per-interval — upkeep units consumed each interval
ward-tiers-default: basic
ward-tiers:
  basic:
    min-base-score: 0
    max-base-score: 99
    base-radius: 16
    radius-per-score: 0.1
    upkeep-per-interval: 1
  reinforced:
    min-base-score: 100
    max-base-score: 499
    base-radius: 32
    radius-per-score: 0.1
    upkeep-per-interval: 3
  advanced:
    min-base-score: 500
    max-base-score: 2147483647
    base-radius: 64
    radius-per-score: 0.1
    upkeep-per-interval: 10

building-cost:
  categories:
    light:
      base-cost: 1
    basic:
      base-cost: 1
    reinforced:
      base-cost: 3
    advanced:
      base-cost: 10
    special:
      base-cost: 15
  overrides:
    OBSIDIAN: reinforced
    CRYING_OBSIDIAN: advanced
    IRON_BLOCK: advanced
    DIAMOND_BLOCK: special
    NETHERITE_BLOCK: special
