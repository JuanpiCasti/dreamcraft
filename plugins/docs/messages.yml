  title.city: "&8Matriz &f{name}"
  title.estate-lobby: "&8Nexo &f{name}"
  title.estate-instance: "&8Instancia &f{name}"
  title.estate-admin-zones: "&8Zonas de aventura (admin)"
  # Paneles admin de Núcleos y Matrices (/{cmd.ward} admin menu · /{cmd.city} admin menu)
  title.ward-admin: "&8Núcleos · Panel admin"
  title.city-admin: "&8Matrices · Panel admin"
  title.ward-admin-detail: "&8Admin · {name}"
  title.city-admin-detail: "&8Admin · {name}"
  wardadmin.dissolved: "Núcleo {name} apagado."
  wardadmin.no-core-block: " (sin bloque físico)"
  wardadmin.tp-done: "✦ Sintonización completa: centro del núcleo."
  wardadmin.menu-unavailable: "El menú del Núcleo no está disponible."
  cityadmin.menu-unavailable: "El menú de la Matriz no está disponible."
  # Estados huérfano y avisos de sobrecosto del panel admin
