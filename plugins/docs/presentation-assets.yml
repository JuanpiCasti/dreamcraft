sounds:
  # Claves vanilla por defecto; el pack podrá sustituirlas por sonidos custom.
  menu.click: ui.button.click
  menu.error: block.note_block.bass
  menu.success: entity.experience_orb.pickup

fonts:
  # Fuentes del pack (claves Adventure namespace:key). Vacío hasta que el RP las defina.
  dc.hud: "dreamcraft:hud"
  dc.gui: "dreamcraft:gui"
  dc.gothic: "dreamcraft:gothic"

symbols:
  # Glifos decorativos (barras, marcos) — requieren la fuente asociada.
  bar.full: "\uE000"
  bar.empty: "\uE001"
  # Fondo gráfico del menú: un glifo por tamaño de inventario que cubre el
  # contenedor vanilla cuando el jugador tiene el pack cargado.
  menu.bg.9:  { glyph: "\uE100", font: dc.gui }
  menu.bg.18: { glyph: "\uE101", font: dc.gui }
  menu.bg.27: { glyph: "\uE102", font: dc.gui }
  menu.bg.36: { glyph: "\uE103", font: dc.gui }
  menu.bg.45: { glyph: "\uE104", font: dc.gui }
  menu.bg.54: { glyph: "\uE105", font: dc.gui }
  # Familias temáticas por dominio de menú (marco acero=menu.bg.*, azul=matriz,
  # violeta=nexo). El compositor elige por prefijo del menuId; los admin heredan.
  menu.bg.matriz.9:  { glyph: "\uE110", font: dc.gui }
  menu.bg.matriz.18: { glyph: "\uE111", font: dc.gui }
  menu.bg.matriz.27: { glyph: "\uE112", font: dc.gui }
  menu.bg.matriz.36: { glyph: "\uE113", font: dc.gui }
  menu.bg.matriz.45: { glyph: "\uE114", font: dc.gui }
  menu.bg.matriz.54: { glyph: "\uE115", font: dc.gui }
  menu.bg.nexo.9:    { glyph: "\uE120", font: dc.gui }
  menu.bg.nexo.18:   { glyph: "\uE121", font: dc.gui }
  menu.bg.nexo.27:   { glyph: "\uE122", font: dc.gui }
  menu.bg.nexo.36:   { glyph: "\uE123", font: dc.gui }
  menu.bg.nexo.45:   { glyph: "\uE124", font: dc.gui }
  menu.bg.nexo.54:   { glyph: "\uE125", font: dc.gui }
  # Glifos horneados por menú (panel + botones pintados; los ítems son
  # capturadores invisibles menu.catcher)
  menu.bg.ward_status:      { glyph: "\uE130", font: dc.gui }
  menu.bg.ward_inactive:    { glyph: "\uE134", font: dc.gui }
  menu.bg.city_overview:    { glyph: "\uE131", font: dc.gui }
  menu.bg.estate_lobby:     { glyph: "\uE132", font: dc.gui }
  menu.bg.estate_instance:  { glyph: "\uE133", font: dc.gui }
  # violeta=nexo). El compositor elige por prefijo del menuId; los admin heredan.
  # Glifos de offset para ajustar el anclaje horizontal de los botones.
  menu.offset.-1: { glyph: "\uEC01", font: dc.gui }
  menu.offset.-2: { glyph: "\uEC02", font: dc.gui }
  menu.offset.-4: { glyph: "\uEC04", font: dc.gui }
  menu.offset.1:  { glyph: "\uEC11", font: dc.gui }
  menu.offset.2:  { glyph: "\uEC12", font: dc.gui }

particles:
  # Partículas visuales de estado (nombre del enum Bukkit).
  ward.active: ENCHANT
