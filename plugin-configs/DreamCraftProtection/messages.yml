# ── Catálogo de mensajes (idioma único: es) ──────────────────────────────────
# Resolución: plugins/DreamCraftProtection/messages.yml (override del servidor)
#             → este archivo (default embebido) → fallback en código.
# Soporta códigos & y placeholders {nombre}.
#
# Cada servidor puede re-marcar estos textos sin recompilar: copia este archivo
# a plugin-configs/DreamCraftProtection/messages.yml y config-sync lo montará.

prefixes:
  global: "&5[DreamCraft]"
  ward: "&b[Sincronía]"
  city: "&b[Ciudad]"
  estate: "&d[Nexo]"
  protection: "&3[Protección]"

common:
  players-only: "&cEste comando solo puede ser usado por jugadores."
  no-permission: "&cNo tienes permiso para usar este comando."
  no-permission-action: "&cNo tienes permiso para este comando."
  unknown-subcommand: "&cSubcomando desconocido: {sub}"
  error: "&cError: {message}"
  invalid-amount: "&cCantidad inválida: {amount}"
  player-not-found: "&cJugador {player} no encontrado o no está en línea."
  # Lore «El Despertar»: acciones de energía/fase exigen presencia física
  physical-required: "&cDebes interactuar físicamente con tu Bloque de DreamCraft para esto."
  physical-hint: "&7Acércate a tu Núcleo o consigue el &benlace remoto VIP&7 (&f/sync tp&7)."

# Feedback específico del lore «El Despertar y la Sincronicidad»
sync:
  sintonized: "&aFrecuencia compartida: los constructores ya pueden edificar y usar contenedores."
  desintonized: "&eFrecuencia cerrada: revocado el acceso público de construcción y contenedores."
  tp-done: "✦ Sintonización completa: llegada al núcleo."
  nucleus-not-found: "&cNúcleo no encontrado. Usa <id> o el nombre de un jugador online."

# Ítem físico y títulos de menús — vocabulario del lore
items:
  nucleus-name: "&bNúcleo de Sincronía"
  nucleus-lore:
    - "&7Colocalo para despertar tu territorio"
    - "&7La protección se extiende en radio alrededor de este bloque"

menu:
  title.ward: "&8Núcleo &f{name}"
  title.city: "&8Matriz &f{name}"
  title.estate-lobby: "&8Nexo &f{name}"
  title.estate-instance: "&8Instancia &f{name}"

help:
  ward:
    header: "&b&l✦ Sincronía · DreamCraft ✦"
    subtitle: "&7Gestiona tu territorio despierto con &f/{cmd.ward}&7.
    lines:
      - "&f/sync despertar           &7— Despierta tu Núcleo en tu posición"
      - "&f/sync info [id]           &7— Fase actual, letargo y coordenadas"
      - "&f/sync renombrar <nombre>  &7— Renombra tu zona despierta"
      - "&f/sync sintonizar          &7— Abre la frecuencia a constructores"
      - "&f/sync expulsar            &7— Cierra la frecuencia compartida"
      - "&f/sync permisos [p g|r]    &7— Flags públicos detallados"
      - "&f/sync upkeep deposit <m> <n> &7— Alimenta el núcleo (junto al bloque)"
      - "&f/sync score add <n>       &7— Suma score de fase (junto al bloque)"
      - "&f/sync menu [id]           &7— Panel completo &8(VIPs/admins)"
      - "&f/sync tp                  &7— Salta a tu núcleo &8(VIPs/owner)"
      - "&f/sync transfer <jugador>  &7— Cede la propiedad del núcleo"
      - "&f/sync city [annex|leave]  &7— Federarse a una Matriz (ciudad)"
      - "&f/sync delete [id]         &7— Apaga el núcleo"
      - "&8Staff: /{cmd.ward} abrir <id|jugador> · /{cmd.ward} dar - /{cmd.protection} recargar"
  city:
    header: "&6&lMatriz de Sincronía"
    subtitle: "&7Gestiona tu Red — une núcleos bajo una frecuencia común. &f{cmd.ward} city annex"
    lines:
      - "&f/{cmd.city} fundar <nombre>     &7— Fundar una Matriz"
      - "&f/{cmd.city} info [nombre]      &7— Ver información"
      - "&f/{cmd.city} menu                &7— Abrir menú de la Matriz"
      - "&f/{cmd.city} annex <nucleoId>    &7— Anexar un Núcleo (&f={cmd.ward} city annex&7)"
      - "&f/{cmd.city} invite <jugador>    &7— Invitar residente"
      - "&f/{cmd.city} kick <jugador>      &7— Expulsar residente"
      - "&f/{cmd.city} roles <jugador> <rol> &7— Asignar rol"
      - "&f/{cmd.city} bank <deposit|withdraw> <monto> &8(admin)"
      - "&f/{cmd.city} policy set <politica> <on|off> &7— Cambiar política"
      - "&f/{cmd.city} transfer <jugador>  &7— Transferir gobernanza"
      - "&f/{cmd.city} delete              &7— Eliminar la Matriz"
      - "&7Roles: GOVERNOR, COUNCIL, CITIZEN, ALLY"
  estate:
    header: "&d&lNexo de Aventura"
    subtitle: "&7Zonas de expedición grupal. &f/{cmd.estate} &7≡ &f{cmd.ward} grupo"
    lines:
      - "&f/{cmd.estate} create <id>          &7— Crear Nexo"
      - "&f/{cmd.estate} discover <tipo>      &7— Unirte a la aventura (end, trial_chamber)"
      - "&f/{cmd.estate} admin create <id> <tipo> [radio|auto] &8(admin)"
      - "&f/{cmd.estate} admin area <id> [radio]  &8(admin)"
      - "&f/{cmd.estate} admin reset <id>     &8(admin)"
      - "&f/{cmd.estate} invite <jugador>     &7— Invitar miembro"
      - "&f/{cmd.estate} join <id>           &7— Unirse a un Nexo"
      - "&f/{cmd.estate} leave               &7— Salir del Nexo"
      - "&f/{cmd.estate} start               &7— Iniciar instancia"
      - "&f/{cmd.estate} transfer <jugador>   &7— Transferir ownership"
      - "&f/{cmd.estate} info                &7— Ver información"
      - "&f/{cmd.estate} menu                &7— Abrir menú del Nexo"
      - "&f/{cmd.estate} disband             &7— Disolver Nexo"
  protection:
    header: "&5&lDreamCraft Protection"
    subtitle: "&7Gestiona tu Núcleo — misma mecánica que &f/{cmd.ward}&7."
    lines:
      - "&f/{cmd.protection} claim       &7— Abrir el menú del Núcleo &8(vips/gobernadores)"
      - "&f/{cmd.protection} status      &7— Consultar el estado del Núcleo"
      - "&f/{cmd.protection} rename <nombre> &7— Renombrar"
      - "&f/{cmd.protection} upkeep [deposit <material> <n>] &7— Mantenimiento"
      - "&f/{cmd.protection} permissions [perm grant|revoke] &7— Permisos públicos"
      - "&f/{cmd.protection} upgrade     &7— Mejorar la fase del Núcleo"
      - "&f/{cmd.protection} transfer <jugador> &7— Transferir ownership"
      - "&f/{cmd.protection} members     &7— Info de miembros (vía Matriz)"
      - "&f/{cmd.protection} dissolve    &7— Disolver el Núcleo"
    admin:
      header: "&c&lAdmin:"
      lines:
        - "&f/{cmd.protection} give        &7— Recibir Baliza de Núcleo"
        - "&f/{cmd.protection} recargar    &7— Recargar configuración"
        - "&f/{cmd.protection} recalculate &7— Re-sincronizar la región"
        - "&f/{cmd.protection} integrations &7— Estado del Integration Registry"

