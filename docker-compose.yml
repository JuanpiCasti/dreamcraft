services:
  config-sync:
    image: alpine
    volumes:
      - ./plugin-configs:/src:ro
      - ./data/plugins:/dest
    command: sh -c "mkdir -p /dest && cp -rf /src/. /dest/ && chown -R 1000:1000 /dest"

  # Servidor HTTP estatico para distribuir el pack en test local.
  # El cliente MC descarga de aca; en produccion se reemplaza por el host publico.
  pack-http:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./resource-packs/dist:/usr/share/nginx/html:ro

  mc:
    image: itzg/minecraft-server:stable-java25
    pull_policy: daily
    tty: true
    stdin_open: true
    depends_on:
      config-sync:
        condition: service_completed_successfully
    ports:
      - "25566:25565"
      - "19133:19132/udp"
    environment:
      MEMORY: 3G
      EULA: TRUE
      TYPE: PAPER
      VERSION: 26.1.2
      PAPER_BUILD: 74
      ONLINE_MODE: false
      DEBUG: true
      DEBUG_EXEC: true
      DEBUG_MEMORY: true
      SEED: 6006216005338798975
      MOTD: '\u00A7f\u00A7l>> \u00A75\u00A7lDREAM\u00A71\u00A7lCRAFT \u00A7f\u00A7l<<\n\u00A7oExplora, construye tu ciudad y combate'
      ICON: /data/server-icon.png
      OVERRIDE_ICON: TRUE
      # Resource pack (soporte nativo itzg). SHA1 = build actual de dist/.
      # URL temporal de test local (nginx sidecar). PENDIENTE host definitivo
      # (repo publico dreamcraft-pack); recalcular SHA1 en cada rebuild.
      RESOURCE_PACK: http://localhost:8081/dreamcraft-resource-pack-31e5e101.zip?v=31e5e1012e25c0eb04eee115bcb970567f5ba7dc
      RESOURCE_PACK_SHA1: 31e5e1012e25c0eb04eee115bcb970567f5ba7dc
      RESOURCE_PACK_ENFORCE: "false"
      RESOURCE_PACK_PROMPT: "¿Deseas descargar el Resource Pack oficial de DreamCraft?"
      PLUGINS: |
        https://cdn.modrinth.com/data/Lu3KuzdV/versions/Kma0kBsY/CoreProtect-CE-24.0.jar
        https://download.luckperms.net/1668/bukkit/loader/LuckPerms-Bukkit-5.5.81.jar
        https://repo.nickuc.com/files/latest/nLogin.jar
        https://cdn.modrinth.com/data/HYKaKraK/versions/h0ncTpUP/packetevents-spigot-2.13.0.jar
        https://github.com/EssentialsX/Essentials/releases/download/2.22.0/EssentialsX-2.22.0.jar
        https://github.com/EssentialsX/Essentials/releases/download/2.22.0/EssentialsXChat-2.22.0.jar
        https://github.com/EssentialsX/Essentials/releases/download/2.22.0/EssentialsXSpawn-2.22.0.jar
        https://cdn.modrinth.com/data/1u6JkXh5/versions/F5ea2ov3/worldedit-bukkit-7.4.5.jar
        https://cdn.modrinth.com/data/DKY9btbd/versions/btHBavWa/worldguard-bukkit-7.0.18.jar
        https://cdn.modrinth.com/data/fALzjamp/versions/MdY6JATr/Chunky-Bukkit-1.5.3.jar
        https://cdn.modrinth.com/data/TsLS8Py5/versions/wXS6bHiC/SkinsRestorer.jar
        https://cdn.modrinth.com/data/P1OZGk5p/versions/ZH8459B6/ViaVersion-5.11.0.jar
        https://cdn.modrinth.com/data/NpvuJQoq/versions/hYhg2QBT/ViaBackwards-5.11.0.jar
        https://download.geysermc.org/v2/projects/geyser/versions/2.11.1/builds/1219/downloads/spigot
        https://cdn.modrinth.com/data/DsxKmIdB/versions/oMsqzDSV/worldguard-extraflagsplus-4.4.3.jar
    volumes:
      # attach the relative directory 'data' to the container's /data path
      - ./data:/data
